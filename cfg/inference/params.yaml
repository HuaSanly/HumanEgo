# Paths are relative to this file; BRX calibration remains explicitly unmeasured.
policy:
  ckpt: ../../runs/pick_cube/HumanEgo_anchor/latest.pt
  num_inference_steps: 20
  device: cuda
  noise_seed: 0
  noise_path: null
camera:
  image_size_hw:
  - 480
  - 640
  intrinsics_path: intrinsics.yaml
  extrinsics_path: extrinsics.yaml
perception:
  # Stationary unheld objects; release triggers obj2 relocalization.
  object_update_mode: events
  object_ttl_s: 1.0
  stereo:
    depth_range_m:
    - 0.15
    - 2.5
    lr_threshold_px: 1.0
  anchor_key: obj1
  object_prompts:
    obj1: a blue plastic container .
    obj2: a red block .
  erase_prompt: a robot arm . a robot gripper .
  segmentation:
    dino_model_id: IDEA-Research/grounding-dino-tiny
    dino_revision: a2bb814dd30d776dcf7e30523b00659f4f141c71
    sam2_revision: 7c218beaf0bb87874785f32b582f640134fc1c09
    sam2_repo_id: facebook/sam2-hiera-tiny
    box_threshold: 0.3
    dino_precision: float16
    sam_precision: float16
    dino_shortest_edge: 800
    dino_cuda_kernel_revision: a4431ff2d5767c279f0ff2335a87a6828b77c7a0
    joint_object_detection: true
  lama:
    repo_id: Carve/LaMa-ONNX
    revision: c3c0c9e468934d62e79c329e35d82dd09ff8c444
    filename: lama_fp32.onnx
    input_size_hw:
    - 512
    - 512
    mask_dilation: 9
    static_batch: true
    cuda_graph: true
  rendering:
    canvas_hw:
    - 1232
    - 1624
    width_open_m: 0.18
    width_closed_m: 0.05
    finger_length_m: 0.08
    root_depth_m: 0.08
    points_per_segment: 6
    hand_radius: 4
    object_radius: 5
    white_core_radius: 1
    open_colors:
    - - 0
      - 255
      - 255
    - - 0
      - 160
      - 255
    - - 0
      - 60
      - 255
    - - 0
      - 0
      - 255
    closed_colors:
    - - 255
      - 255
      - 255
    - - 255
      - 255
      - 255
    - - 255
      - 0
      - 255
    - - 255
      - 0
      - 255
    object_colors:
      obj1:
      - 255
      - 255
      - 0
      obj2:
      - 0
      - 255
      - 0
deployment:
  log_dir: ../../runs/inference
  log_level: INFO
  action_deadline_s: 30.0
  idle_timeout_s: 60.0
  warmup_calls: 2
  diagnostic_dir: null
  diagnostic_mode: canvas  # full saves per-request process data when diagnostic_dir is set
  name: humanego-pick-cube-anchor
  mode: chunk
  action_fps: 30.0
  listen_endpoint: tcp/0.0.0.0:7447

# BRX 躯干保持竖直，整机固定在地面，仅右臂和右夹爪参与原 pick_cube 任务。
base_config: pick_cube.yaml
robot: brx20260825
mode: single
rig:
  base_pose:
    right:
      # 保留首次 BRX 场景的底盘位置，朝世界 +X 正前方，不通过移动机器人适配任务。
      position: [-0.14639, 0.32001, -0.32104]
      rpy_deg: [0, 0, 0]
  arm_mount: false
  table:
    # 桌面高 0.91 m，比上一布局再升高 5 cm；地面及机器人底座不动。
    height: 0.91
    x_min: 0.19
  view_cameras:
    front_view:
      position: [0.88, -1.85, 0.95]
      look_at: [0.10, 0.10, 0.05]
      fovy: 48
physics:
  robot_gripper:
    brx20260825:
      force: 35.0
control:
  safe_z_min: 0.45
  grasp_assist:
    duration_smooth_param: 3.0
    close_hold_min: 0.45
  release_assist:
    wait_time: 0.4
  withdrawal:
    enabled: true
    rim_clearance: 0.02
    collision_margin: 0.003
    speed: 0.10
    home_time: 1.6
    timeout: 5.0
scene:
  objects:
    cube:
      # 相对上一布局前移 6 cm（+X）、左移 2 cm（+Y），保持在待机夹爪侧方。
      pose: [0.34, -0.14, 0.0]
    container:
      # 随升高的桌面调整位置，保持投放姿态可达及外置策略相机完整取景。
      pose: [0.46, 0.20, 0.0]
      size: [0.1515524680683616, 0.22978338074932372, 0.09647649800453617]
evaluation:
  sampling: eval_pick_cube_brx.yaml

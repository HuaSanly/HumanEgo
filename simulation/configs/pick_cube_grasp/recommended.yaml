# D appearance/geometry retained; reachable cube pose and perception-guided grasp controller.
base_config: ../real2sim_pick_cube/D.yaml
control:
  grasp_assist:
    enabled: true
    refine: true
    lateral_gain: 1.0
    along_max: 0.0
    height_min: 0.0
    height_max: 0.0
    arrive_tol: 0.008
    approach_timeout: 4.0
    timeout_near: 0.02
    approach_max: 8.0
    close_hold: 0.7
    regrasp_max: 1
    retry_lower: 0.0
    retry_inward: 0.0
    orientation_world_rpy_deg:
    - 180
    - 0
    - 180
    arrive_rot_deg: 8.0
  duration_smooth_param: 4.0
  alpha: 0.3
  max_rot_step: 0.08
  grasp_latch: false
scene:
  objects:
    cube:
      pose:
      - 0.4
      - -0.2
      - 0.0

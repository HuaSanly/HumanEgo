# =============================================================================
# HumanEgo simulation — serve_bread
# =============================================================================
# World frame: origin on the table top directly below the camera, +x forward
# (away from the robot), +y to the robot's left, +z up. All lengths in metres.
# =============================================================================

task: serve_bread
mode: bimanual             # "single" (right arm, as in the paper) | "bimanual" (as in the teaser)
robot: trossen_wxai        # trossen_wxai | franka_panda | ur5e
camera: realsense_d405     # realsense_d405 | realsense_d435 | zed2i | zed_mini

policy:
  ckpt: ./checkpoints/serve_bread/latest.pt     # huggingface-cli download Leo-TX/HumanEgo --include "serve_bread/*" --local-dir ./checkpoints
  num_inference_steps: 20
  seed: 7                                       # flow-matching noise seed (fixed per episode, like the real loop)

rig:
  # Camera optical centre above the table top. Measured from two real front-view frames
  # (arms at home): bases ~0.15 m above the table, camera 0.221 m above the bases -> 0.366 m
  # (docs/real_vs_sim.md, docs/proposed_scene.json; confidence medium, confirm with a real
  # log). The earlier 0.436 (bases 0.215 m up) was inferred from the Control.yaml comment that
  # safe_z_min = -0.20 "protects the table"; at 0.366 the production controller's single-arm
  # success rises from 12.5 % to 67.5 % (real: 95 %).
  cam_height: 0.366
  # Hand-eye calibration of the real HumanEgo rig (AriaMimic cfg/inference/serve_bread)
  T_base_in_cam:
    right: [[0.0, -1.0, 0.0, 0.323765], [-0.60181502, 0.0, -0.79863551, 0.10437084],
            [0.79863551, 0.0, -0.60181502, 0.22907588], [0.0, 0.0, 0.0, 1.0]]
    left:  [[0.0, -1.0, 0.0, -0.323765], [-0.60181502, 0.0, -0.79863551, 0.10437084],
            [0.79863551, 0.0, -0.60181502, 0.22907588], [0.0, 0.0, 0.0, 1.0]]
  # The real rig's left start pose is not the mirror of the right one; in simulation that alone
  # costs the left arm ~15 points of success. true = start the left arm at the exact mirror.
  mirror_left_start: false
  table:
    x_min: -0.35           # edge under the robot frame
    x_max: 0.98
    half_width: 0.75
    thickness: 0.045

scene:
  # object initial poses on the table: [x, y, yaw_deg]
  plate: [0.47, 0.00, 0.0]
  # bread yaw ~90 deg = long axis left-right in the image, as in the human demos.
  # Real bimanual rollout: croissant for the right arm, sugar danish loaf for the left.
  bread:
    right: {type: croissant, pose: [0.46, -0.27, 95.0], scale: 1.06}   # 14.5 cm long, as in the human data
    left: {type: bun, pose: [0.46, 0.27, 85.0]}
  single:                  # used when mode == single (paper layout: plate left, bread right)
    plate: [0.47, 0.11, 0.0]
    bread: {type: croissant, pose: [0.47, -0.15, 95.0], scale: 1.06}

physics:
  timestep: 0.002
  # Bread is a soft body: a MuJoCo flex whose surface is interpolated from a trilinear grid
  # of point masses with volumetric elasticity (humanego_sim/softbody.py). The fingers sink
  # into the crumb and the grip holds by friction alone.
  bread_model: soft        # soft | rigid (convex parts + finger adhesion: the earlier proxy)
  soft:
    dof: trilinear
    cells: {croissant: [4, 2, 2], bun: [4, 2, 2]}
    young: 2.0e+4          # Pa; brioche crumb 20 +- 3 kPa, croissant ~15-60 kPa (docs/physics_params.md)
    poisson: 0.25
    damping: 0.03          # s, Rayleigh: crumb loss tangent 0.17 at ~1 Hz (the grasp time scale)
    radius: 0.001
  impratio: 100            # friction regulariser 1/100 of the normal one: sub-slip creep of a held bread 0.1-0.8 mm/s
                           # (impratio 10: 10x faster; the real bread does not visibly slip, docs/physics_params.md)
  # Contact: every bread contact takes the larger friction of the two surfaces (bread priority 0 like all
  # geoms), so the crust's own value is the floor (crust on crust / hard plastic) and the finger pads, plate
  # and table set theirs; solmix makes the bread's solref / solimp win. Sources: docs/physics_params.md.
  bread_friction: [0.4, 0.01, 0.001]   # crust on hard surfaces and on crust (0.25-0.55)
  pad_friction: 0.8        # crust on the silicone / rubber finger pads (0.5-1.1)
  plate_friction: 0.4      # plastic plate (0.25-0.55)
  table_friction: 0.45     # finished maple (0.3-0.6); also plate on table
  bread_priority: 0
  bread_solmix: 1000.0
  bread_mass: {croissant: 0.050, bun: 0.075}
  # over-damped (damping ratio 3) so a dropped bread lands dead (e ~ 0.17, drop tests), but stiff in steady
  # state (solimp 0.995): the fingers' indentation comes from the crumb's E, not from contact penetration
  # (crumb cube: apparent E 16 kPa of 20, against 6.8 kPa with solimp 0.95)
  bread_solref: [0.004, 3.0]
  bread_solimp: [0.95, 0.995, 0.001, 0.5, 2.0]
  bread_condim: 4
  plate_mass: 0.45
  # Trossen gripper: the Menagerie servo (kp 339 N/m, system-identified on the real arm) with its own force
  # cap; closing on a bread it squeezes 4-8 N per finger
  gripper_force: 35.0      # N, actuator cap (Menagerie)
  robot_gripper:
    ur5e: {force: 2.2}     # 2F-85 tendon cap -> ~20 N per pad: the gripper's minimum force setting (20-235 N)
    franka_panda: {force: 40.0, kp_scale: 30.0}   # force-controlled grasp, ~20 N per finger (frankx default; 70 N cont.)
  finger_adhesion: 6.0     # rigid model only: N per finger while closed (soft-bread proxy)
  arm_kp_scale: 4.0        # x Menagerie gains (real Trossen servos track much tighter)
  arm_kv_ratio: 0.08       # extra joint damping relative to kp

perception:                # mirrors cfg/inference/serve_bread + cfg/preprocess/base/KptsSelector.yaml
  n_init_frames: 10
  depth_noise: true
  latch_dist_thresh: 0.20
  # Masks from 5 detector frames, fused (drop empty / off-size frames, pixel majority vote). The
  # released pipeline runs DINO-SAM on one frame; a missed bread or plate then loses the arm.
  # Fusion is a no-op on clean ground-truth masks; with realistic segmentation errors it serves
  # +9 points per arm (README "Robustness"). 1 = the released single-frame behaviour.
  mask_frames: 5

control:                   # cfg/inference/serve_bread/Control.yaml (real rig)
  control_freq: 10.0
  step_stride: 2
  look_ahead_offset: 35
  max_history_len: 1
  alpha: 0.5
  alpha_rot: 0.0
  duration_smooth_param: 12.0
  grasp_threshold: 0.70
  should_grasp_method: any_first_k   # 'any' restricted to the next grasp_k_any steps (50 = original 'any')
  grasp_k_any: 50
  tcp_offset: 0.0          # m along the approach axis; 0 = real rig's tool point (t_flange_tool 0.156)
  use_safety_cage: true
  max_pos_step: 0.08
  max_rot_step: 0.02
  safe_z_min: -0.20
  done_threshold: 0.99
  done_requires_grasp: true
  grasp_latch: true
  use_idle_done: true
  idle_time_limit: 1.5
  idle_dist_threshold: 0.13
  close_gripper_goal_time: 0.5
  open_gripper_goal_time: 0.5
  bimanual_start_delay: 6.0
  split_x_ratio: 0.5
  policy_period: 0.30      # s between re-plans (real loop ran at ~3.3 Hz with DINO-SAM + LaMa)
  max_episode_time: 40.0

# Per-robot calibration, applied between the defaults above and explicit overrides.
per_robot:
  ur5e:
    physics:
      # the 2F-85's small sharp-cornered pads tunnel into a surface-only flex and the bread
      # then stays hooked on the open gripper; a volumetric flex (tets to the bread's centre)
      # keeps them out (12 scenes: 17% -> 54% per arm)
      soft: {dim: 3}
    control:
      grasp_assist: {gap_empty: 0.015}
  franka_panda:
    physics:
      # Franka's thin fingers slip between the vertices of the coarse collision skin and the
      # bread stays hooked on the open hand; a finer skin with a 2 mm shell keeps them out
      # (24 scenes with the grasp skill: 42% -> 50% per arm, stuck breads 12 -> 2)
      soft: {surface: fine, radius: 0.002}

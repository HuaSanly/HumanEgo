# Official serve_bread policy and production controller, using the fixed BRX right arm.
base_config: serve_bread.yaml
robot: brx20260825
mode: single
profile: production
rig:
  base_pose:
    right:
      # Centre the upright robot on the tabletop task, facing world +X.
      position: [0.01361, -0.20, -0.32104]
      rpy_deg: [0, 0, 0]
  head_pose:
    pan_deg: 0.0
    tilt_deg: 57.0
  initial_joints:
    # Match the original Trossen starting EE pose in the policy camera frame.
    right: [0.213166, -0.515777, -0.627511, 0.035342, -0.619906, -0.287492, -0.916412]
  arm_mount: false
  # Raise the external policy camera together with the table to retain the
  # original serve_bread camera-to-table calibration.
  cam_height: 0.566
  table:
    height: 0.96
    x_min: 0.29
  view_cameras:
    front_view:
      position: [0.88, -1.85, 0.95]
      look_at: [0.10, 0.10, 0.05]
      fovy: 48
scene:
  single:
    plate: [0.56, 0.10, 0.0]
    bread:
      pose: [0.46, -0.17, 95.0]
control:
  # Base-relative floor, about 21 mm below this tabletop.
  safe_z_min: 0.50
  grasp_assist:
    enabled: false
  release_assist:
    enabled: false
  withdrawal:
    enabled: false
